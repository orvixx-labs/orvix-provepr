[project]
name = "orvix-provepr"
version = "0.2.1"
description = "Make AI coding agents prove their PR claims in a real browser, and fix what fails."
readme = "README.md"
authors = [
    { name = "Tirth", email = "trhatwork@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
keywords = ["ai-agents", "claude-code", "codex", "mcp", "playwright", "pull-request", "verification"]
dependencies = [
    "mcp>=2.3",
    "pillow>=13.0.0",
    "playwright>=1.64.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/orvixx-labs/orvix-provepr"
Repository = "https://github.com/orvixx-labs/orvix-provepr"
Documentation = "https://github.com/orvixx-labs/orvix-provepr/blob/main/src/provepr/docs/guide.md"
Issues = "https://github.com/orvixx-labs/orvix-provepr/issues"

[project.scripts]
provepr = "provepr.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "provepr"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
